<!DOCTYPE html>
<html>
    <head>
        <title>Week 3 Drawing using the HTML Canvas</title>
        <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #container{
            width: 800px;
            text-align: venter;
            margin-left: auto;
            margin-right: auto;
            }
        </style>
    </head>
    <body>
        <div id="container">
             <h1>week 3 Lab - Drawing on the HTML Canvas</h1>
            <canvas id="canvas" width="800" height="600" style="border: 1px solid black">
                Your browser does not support the html canvas element
            </canvas>
        </div>
        <!-- In Document Javascript -->
       <script>
        // These are the common variables for settiing up the canvas
        var canvas = document.getElementById("canvas")
        var ctx = canvas.getContext("2d"); 
        
        // draw a square
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(canvas.width/2 - 25, canvas.height/2 - 25, 50, 50);

        ctx.fillStyle = "yellow";
        ctx.fillRect(750, canvas.height/2 - 25, 50, 50);

        ctx.fillStyle = "green";
        ctx.fillRect(0, 0, 50, 50);

        ctx.fillStyle = "blue";
        ctx.fillRect(0, 550, 50, 50);

        ctx.fillStyle = "purple";
        ctx.fillRect(750, 0, 50, 50);

        ctx.fillStyle = "black";
        ctx.fillRect(750, 550, 50, 50);

        // Outline Box 
        ctx.strokeStyle = "orange";
        ctx.strokeRect(canvas.width/2 - 25, 550, 50, 50);

        // Let's draw some lines
        ctx.strokeStyle = "black";
        ctx.lineWidth = 5.0;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(800, 600);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(800, 0);
        ctx.lineTo(canvas.width/2 + 25, canvas.height/2 - 25);
        ctx.lineTo(canvas.width/2 + 25, canvas.height/2 + 25);
        ctx.lineTo(canvas.width/2 - 25, canvas.height/2 + 25);
        ctx.lineTo(canvas.width/2 -25, canvas.height/2 - 25);
        ctx.lineTo(canvas.width/2 +25, canvas.height/2 -25);
        ctx.stroke();

        //  Let's draw a cricle
        ctx.fillStyle = "yellow"; 
        ctx.beginPath();
        ctx.arc(200, 300, 100, 0, 2 * Math.PI);
        ctx.fill()
        ctx.stroke();
        //  Let's draw a cricle again - its pacman
        ctx.fillStyle = "green"; 
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.arc(600, 300, 100, degreesToRadians(45), degreesToRadians(315));
        ctx.lineTo(600, 300);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        function degreesToRadians(degrees){
            let radian = degrees * (Math.PI/180)
            return radian;
        }
        function drawCircle(xPos, yPos, radius, startAngle, endAngle){
            ctx.beginPath();
            ctx.arc(xPos, yPos, radius, degreesToRadians(startAngle), degreesToRadians(endAngle));
            ctx.fill();
            ctx.stroke();
            console.log("circle");
        }

        drawCircle(10,10,10,0,360);

       </script>
       <br>
       <br>
       <hr>
         <a href="../index.html">Link back to Week 1 </a>
    </body>
</html>
